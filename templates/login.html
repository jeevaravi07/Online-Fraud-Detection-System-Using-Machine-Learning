{% extends "base.html" %}

{% block content %}
<style>
    /* Login page specific styles */
    .card {
        max-width: 400px;
        margin: auto;
        position: relative;
        overflow: hidden;
        animation: slideInRight 0.5s ease-out;
    }

    /* Animated gradient border */
    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, 
            #667eea 0%, 
            #764ba2 25%, 
            #f093fb 50%, 
            #4facfe 75%, 
            #667eea 100%);
        background-size: 200% 100%;
        animation: gradientShift 3s ease infinite;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Card entrance animation */
    @keyframes slideInRight {
        from {
            opacity: 0;
            transform: translateX(50px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    /* Heading styling */
    .card h2 {
        font-size: 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 30px;
        text-align: center;
        position: relative;
        display: inline-block;
        width: 100%;
    }

    .card h2::before {
        content: '🔐';
        margin-right: 12px;
        font-size: 1.8rem;
        background: none;
        -webkit-background-clip: unset;
        background-clip: unset;
        color: #667eea;
    }

    .card h2::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 3px;
        animation: widthExpand 0.6s ease-out;
    }

    @keyframes widthExpand {
        from {
            width: 0;
            opacity: 0;
        }
        to {
            width: 60px;
            opacity: 1;
        }
    }

    /* Form styling */
    form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* Input field styling */
    input {
        width: 100%;
        padding: 14px 16px;
        font-size: 15px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        transition: all 0.3s ease;
        background: white;
        font-family: inherit;
    }

    input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
    }

    input:hover {
        border-color: #764ba2;
    }

    /* Placeholder styling */
    input::placeholder {
        color: #a0aec0;
        transition: all 0.3s ease;
    }

    input:focus::placeholder {
        opacity: 0.5;
        transform: translateX(5px);
    }

    /* Specific input icons */
    input[name="username"] {
        background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%23667eea"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>');
        background-repeat: no-repeat;
        background-position: 16px center;
        background-size: 20px;
        padding-left: 48px;
    }

    input[type="password"] {
        background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%23667eea"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>');
        background-repeat: no-repeat;
        background-position: 16px center;
        background-size: 20px;
        padding-left: 48px;
    }

    /* Button styling */
    button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 14px 28px;
        color: white;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Button ripple effect */
    button::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }

    button:hover::before {
        width: 300px;
        height: 300px;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
        transform: translateY(0);
    }

    /* Decorative elements */
    .card::after {
        content: '🔒';
        position: absolute;
        bottom: 20px;
        right: 20px;
        font-size: 50px;
        opacity: 0.05;
        pointer-events: none;
        transition: all 0.3s ease;
    }

    .card:hover::after {
        opacity: 0.1;
        transform: scale(1.1) rotate(5deg);
    }

    /* Floating label effect */
    .card {
        position: relative;
    }

    /* Add help text (optional decorative) */
    .login-help {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
        color: #718096;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .card {
            max-width: 90%;
            margin: 20px auto;
        }
        
        .card h2 {
            font-size: 1.6rem;
        }
        
        .card h2::before {
            font-size: 1.4rem;
        }
        
        input {
            padding: 12px 14px;
            font-size: 14px;
        }
        
        input[name="username"],
        input[type="password"] {
            padding-left: 42px;
            background-size: 18px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 14px;
        }
    }

    /* Loading state for button (optional) */
    button.loading {
        pointer-events: none;
        opacity: 0.7;
    }

    button.loading::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        top: 50%;
        left: 50%;
        margin-left: -10px;
        margin-top: -10px;
        border: 2px solid white;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Error message styling (if any) */
    .error-message {
        background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        color: #721c24;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        animation: shake 0.5s ease-out;
        border-left: 4px solid #dc3545;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }

    /* Success message styling */
    .success-message {
        background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        color: #155724;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        border-left: 4px solid #28a745;
    }

    /* Focus visible for accessibility */
    input:focus-visible,
    button:focus-visible {
        outline: 2px solid #667eea;
        outline-offset: 2px;
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
        input {
            background: #2d3748;
            border-color: #4a5568;
            color: #e2e8f0;
        }
        
        input::placeholder {
            color: #718096;
        }
        
        input:focus {
            border-color: #667eea;
        }
    }

    /* Print styles */
    @media print {
        .card::before,
        .card::after,
        button::before {
            display: none;
        }
        
        button {
            background: #667eea;
            color: white;
        }
        
        input {
            border: 1px solid #ddd;
        }
    }
</style>

<div class="card" style="max-width:400px; margin:auto;">
    <h2>Login</h2>

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
